name: Release

# Pushing a tag such as v0.2.0 builds Peek, signs its updates, uploads
# them with the disk image and install script to the release of the tag,
# and publishes it, which installed copies of Peek then update to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits since the last tag, for the notes
      # mygo build uploads to the release of mygo.config.ts's version, whichever
      # tag started the workflow, so a tag that disagrees builds nothing.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(node -e 'import("./mygo.config.ts").then((m) => console.log(m.default.version))')"
      # The notes list the Conventional Commits since the last tag; running
      # again updates them.
      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx changelogithub@15 --draft

  build:
    needs: draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The update window shows the version's section of CHANGELOG.md, made
      # here of the notes of the release.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ${GITHUB_REF_NAME#v}"
            echo
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body |
              sed 's/&nbsp;//g' # the indent GitHub shows, which the window would print
          } > CHANGELOG.md
      # One app for Apple silicon and one for Intel, rather than a universal
      # app: each download stays half the size, and installed copies keep
      # updating from update-darwin-arm64.json.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
